schema_version: 1

context:
  version: 0.9.0

package:
  name: hs-connectors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hs-connectors/hs_connectors-${{ version }}.tar.gz
  sha256: 41a7d11507f83e9734428e71b1aa63b2dfc2ef59cb1232d95e7ad1f57fe8bce9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - setuptools-git-versioning >=2.0,<3
    - packaging
    - pip
  run:
    - python >=${{ python_min }}
    - safetensors
    - pytorch >=2.6
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - hs_connectors

about:
  summary: Pluggable backends for transferring hidden states between vLLM and Speculators during online and offline training.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/hs-connectors/
  repository: https://github.com/vllm-project/speculators/tree/main/hs_connectors

extra:
  recipe-maintainers:
    - xhochy
